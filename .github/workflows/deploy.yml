name: Publish Chinese Food Picker
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site and download real food photos
        run: |
          mkdir -p _site/food-images
          cp index.html food_intro_en.txt food_intro_zh.txt readme.txt PHOTO-LINKS.txt service-worker.js _site/
          touch _site/.nojekyll

          # These are real food photographs, packaged on the Pages site so the app
          # can display them from its own origin and cache them for later offline use.
          curl -fLsS --retry 2 'https://images.unsplash.com/photo-1704409043347-fb32f0b6bdcb?auto=format&fit=crop&w=1200&q=82' -o _site/food-images/chinese-feast.jpg
          curl -fLsS --retry 2 'https://images.pexels.com/photos/6752827/pexels-photo-6752827.jpeg?auto=compress&cs=tinysrgb&w=1200' -o _site/food-images/dumpling.jpg
          curl -fLsS --retry 2 'https://images.pexels.com/photos/11160113/pexels-photo-11160113.jpeg?auto=compress&cs=tinysrgb&w=1200' -o _site/food-images/drink.jpg
          curl -fLsS --retry 2 'https://images.pexels.com/photos/9633532/pexels-photo-9633532.jpeg?auto=compress&cs=tinysrgb&w=1200' -o _site/food-images/egg.jpg
          curl -fLsS --retry 2 'https://media.cntraveller.com/photos/65afbd1f82757337b9631bef/master/w_1024%2Cc_limit/Kung%2520Fu%2520Noodle_Beef%2520Noodles_%2520jan24-pr-global-Shot%2520by%2520Nic%2520Crilly%2520Hargrave.jpg' -o _site/food-images/soup.jpg
          curl -fLsS --retry 2 'https://images.pexels.com/photos/461198/pexels-photo-461198.jpeg?auto=compress&cs=tinysrgb&w=1200' -o _site/food-images/noodles.jpg
          curl -fLsS --retry 2 'https://images.pexels.com/photos/2347311/pexels-photo-2347311.jpeg?auto=compress&cs=tinysrgb&w=1200' -o _site/food-images/rice.jpg
          curl -fLsS --retry 2 'https://s.hdnux.com/photos/01/33/62/66/24063381/5/ratio3x2_1920.jpg' -o _site/food-images/skewer.jpg

          # Share a real photo across closely related categories when a dedicated
          # photo isn't needed; every dish category still resolves to a real image.
          cp _site/food-images/chinese-feast.jpg _site/food-images/street.jpg
          cp _site/food-images/rice.jpg _site/food-images/stirfry.jpg
          cp _site/food-images/chinese-feast.jpg _site/food-images/tofu.jpg
          cp _site/food-images/chinese-feast.jpg _site/food-images/fish.jpg
          cp _site/food-images/rice.jpg _site/food-images/greens.jpg
          cp _site/food-images/egg.jpg _site/food-images/dessert.jpg

          test -s _site/food-images/chinese-feast.jpg
          test -s _site/food-images/dumpling.jpg
          test -s _site/food-images/noodles.jpg
          test -s _site/food-images/stirfry.jpg
          test -s _site/food-images/dessert.jpg

          # Validate every packaged photo, not only a few representative files.
          for photo in _site/food-images/*.jpg; do
            test -s "$photo"
            file "$photo" | grep -q 'JPEG image data'
          done
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
